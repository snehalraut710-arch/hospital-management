{% if pagination.pages > 1 %}
{% set params = request.args.to_dict() %}
{% set _ = params.pop('page', None) %}
<div class="pagination">
  {% if pagination.has_prev %}
    <a href="{{ url_for(request.endpoint, page=pagination.prev_num, **params) }}">Previous</a>
  {% endif %}
  <span class="cur">Page {{ pagination.page }} of {{ pagination.pages }}</span>
  {% if pagination.has_next %}
    <a href="{{ url_for(request.endpoint, page=pagination.next_num, **params) }}">Next</a>
  {% endif %}
</div>
{% endif %}
