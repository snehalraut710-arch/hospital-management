<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 700px; background-color: transparent;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#my-svg{font-family:Segoe UI,Roboto,-apple-system,Helvetica,Arial,sans-serif;font-size:14px;fill:#0f1e26;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#f5f8f9;}#my-svg .error-text{fill:#0a0706;stroke:#0a0706;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#5b7480;stroke:#5b7480;}#my-svg .marker.cross{stroke:#5b7480;}#my-svg svg{font-family:Segoe UI,Roboto,-apple-system,Helvetica,Arial,sans-serif;font-size:14px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#12a186;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#12a186;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="main"><rect width="700" height="500" class="background" fill="#f4f4f4"/><g class="chart-title"><text x="0" y="0" fill="#0f1e26" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(350, 23.5) rotate(0)">Triage accuracy (5-fold CV, 13 classes)</text></g><g class="plot"><g class="bar-plot-0"><rect x="72.99062690734863" y="423.85400000000004" width="89.3" height="40.14599999999996" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"/><rect x="251.4437512715658" y="194.606" width="89.3" height="269.394" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"/><rect x="429.8968756357829" y="169.93000000000004" width="89.3" height="294.06999999999994" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"/><rect x="608.35" y="108.63799999999996" width="89.3" height="355.362" fill="#FFF4DD" stroke="#FFF4DD" stroke-width="0"/></g></g><g class="bottom-axis"><g class="axis-line"><path d="M 70.64062690734863,465 L 700,465" fill="none" stroke="#0f1e26" stroke-width="2"/></g><g class="label"><text x="0" y="0" fill="#0f1e26" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(117.64062690734863, 476) rotate(0)">Random</text><text x="0" y="0" fill="#0f1e26" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(296.0937512715658, 476) rotate(0)">Model only</text><text x="0" y="0" fill="#0f1e26" font-size="14" dominant-baseline="text-before-edge" text-anchor="middle" transform="translate(474.5468756357829, 476) rotate(0)">Blended top-1</text><text x="0" y="0" fill="#0f